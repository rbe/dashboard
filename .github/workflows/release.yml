# Tags and manual runs. Branch pushes are CI's event, so this does not
# listen for them and does not run the Linux host checks a second time.
# macOS binary, npm tarball, checksums, and release notes are Makefile
# targets. gh release, artifact upload, and npm auth stay here.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/host-test.yml

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # codesign runs on macOS. The Makefile uses Node already on PATH and
      # does not install it. This action pins Node 24 for that target.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Build the macOS binary
        run: make macos-binary
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-macos
          path: build/dashboard-macos
          if-no-files-found: error

  npm-package:
    needs: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Pack the npm tarball
        run: make npm-tarball CONTAINER=docker
      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: build/dashboard-*.tgz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, npm-package]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
      - name: Write checksums and release notes
        run: make release-assets CONTAINER=docker
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          binary=release/dashboard-macos/dashboard-macos
          tgz=$(echo release/npm-tarball/dashboard-*.tgz)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$binary" "$tgz" build/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$binary" "$tgz" build/SHA256SUMS \
              --title "$GITHUB_REF_NAME" \
              --notes-file build/notes.md
          fi

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH == 'true'
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Provenance and the registry token come from this action.
      # `make npm-publish` refuses unless NPM_PUBLISH=true.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Publish the npm package
        run: make npm-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
