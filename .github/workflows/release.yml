# Tags and manual runs. Branch pushes are CI's event, so this does not
# listen for them and does not run the Linux host checks a second time.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/host-test.yml

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-binary.mjs --macos
      - name: Check the Apple silicon binary
        run: |
          set -euo pipefail
          archs=$(lipo -archs build/dashboard-macos)
          echo "$archs"
          test "$archs" = "arm64"
          file build/dashboard-macos
      - run: node scripts/smoke-binary.mjs build/dashboard-macos
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-macos
          path: build/dashboard-macos
          if-no-files-found: error

  npm-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # prepack builds dist into this tarball. The host-test pack uses --ignore-scripts.
      - run: mkdir -p build && npm pack --pack-destination build
      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: build/dashboard-*.tgz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, npm-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          binary=release/dashboard-macos/dashboard-macos
          tgz=$(echo release/npm-tarball/dashboard-*.tgz)
          tgz_name=$(basename "$tgz")
          {
            echo "$(sha256sum "$binary" | awk '{print $1}')  dashboard-macos"
            echo "$(sha256sum "$tgz" | awk '{print $1}')  $tgz_name"
          } > SHA256SUMS
          TGZ_NAME="$tgz_name" node scripts/release-notes.mjs > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$binary" "$tgz" SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$binary" "$tgz" SHA256SUMS \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md
          fi

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
