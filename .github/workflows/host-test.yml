# Linux host checks: install, test, binary, and the packed CLI.
# The commands are Makefile targets so a laptop runs the same steps.
# CI calls this on every branch push and on workflow_dispatch.
# Release calls this on v* tags and on workflow_dispatch.
# Container does not call this, so an event runs these steps once.
# Node 24 is the image `make host-checks` uses. This job does not install Node.

name: Host test

on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux host checks
        run: make host-checks CONTAINER=docker
