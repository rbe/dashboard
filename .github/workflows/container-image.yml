# Build the app image once, smoke that image, and push it when
# scripts/container-tags.mjs sets publish=true.
# Called only by the Container workflow.
# The build, smoke, tag resolution, save, load, and push commands are
# Makefile targets. The container engine is Podman, same as a laptop.
# GHCR login stays in this file and uses podman login.
# Dependency install and the UI compile stay in the Containerfile image layers.

name: Container image

on:
  workflow_call:

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  resolve:
    name: Resolve tags
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      image: ${{ steps.version.outputs.image }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve GHCR tags
        id: version
        run: make resolve-ghcr-tags

  build:
    name: Build
    needs: resolve
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build the image once and smoke it
        run: make ci-image
        env:
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          IMAGE_REVISION: ${{ github.sha }}
          IMAGE_VERSION: ${{ needs.resolve.outputs.version }}
      - name: Save the loaded image
        if: success() && needs.resolve.outputs.publish == 'true'
        run: make image-save
      - uses: actions/upload-artifact@v7
        if: success() && needs.resolve.outputs.publish == 'true'
        with:
          name: ${{ github.event.repository.name }}-image
          path: ${{ github.event.repository.name }}-image.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish
    needs: [resolve, build]
    if: success() && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-image
          path: image
      - name: Load the image
        run: make image-load
      - name: Log in to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GHCR_TOKEN" | podman login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
      - name: Push the loaded image
        env:
          TAGS: ${{ needs.resolve.outputs.tags }}
        run: make image-push
