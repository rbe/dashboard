# Build the dashboard image once, smoke the loaded image, and push that
# same image when scripts/container-tags.mjs sets publish=true.
# Called only by the Container workflow.
# Dependency install and the UI compile stay in the Containerfile image layers.

name: Container image

on:
  workflow_call:

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  resolve:
    name: Resolve tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      image: ${{ steps.version.outputs.image }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve image tags from package.json
        id: version
        run: node scripts/container-tags.mjs

  build:
    name: Build
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          provenance: false
          build-args: NODE_VERSION=${{ env.NODE_VERSION }}
          tags: dashboard:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.title=dashboard
          cache-from: type=gha,scope=dashboard
          cache-to: ${{ needs.resolve.outputs.publish == 'true' && 'type=gha,scope=dashboard,mode=max' || '' }}
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name dashboard-ci \
            -p 127.0.0.1:4173:4173 \
            -e PORT=4173 \
            dashboard:ci
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs dashboard-ci || true
            fi
            docker rm -f dashboard-ci >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS -k https://127.0.0.1:4173/api/dashboard | grep -q 'not for git'; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1
          curl -fsS -k https://127.0.0.1:4173/ | grep -q 'id="root"'
      - name: Save the loaded image
        if: success() && needs.resolve.outputs.publish == 'true'
        run: docker save dashboard:ci --output dashboard-image.tar
      - uses: actions/upload-artifact@v7
        if: success() && needs.resolve.outputs.publish == 'true'
        with:
          name: dashboard-image
          path: dashboard-image.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish
    needs: [resolve, build]
    if: success() && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-image
          path: image
      - name: Load the image
        run: docker load --input image/dashboard-image.tar
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the loaded image
        env:
          TAGS: ${{ needs.resolve.outputs.tags }}
        run: |
          set -euo pipefail
          docker image inspect dashboard:ci >/dev/null
          IFS=',' read -ra tags <<< "$TAGS"
          test "${#tags[@]}" -gt 0
          for tag in "${tags[@]}"; do
            docker tag dashboard:ci "$tag"
            docker push "$tag"
          done
