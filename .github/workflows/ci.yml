# One pipeline. Delivery is the container image. This repository does not
# create a GitHub release or upload a tarball, image archive, checksums,
# or source to one.
# A push to master or main runs publish-container after the jobs it needs,
# and runs publish-npm when NPM_PUBLISH=true. Any other branch push runs
# through report and does not publish. A v* tag uses the same publish rule.
# A manual publish-npm may publish without NPM_PUBLISH.
# workflow_dispatch runs the one selected job. A manual publish job also
# runs the jobs that produce its artifact, and that manual publish may push.
# report is the last job. It runs after publish, including when publish is
# skipped, and collects the run into one artifact.
# build and test both need setup, so they run together. npm-package needs
# both, then packs the built app. docs renders docs/ to HTML and runs
# beside them. That HTML is not in the package or the image.
# publish-npm and publish-container do not need each other.
# There is no pull_request trigger, so a same-repo branch is not run twice.

name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        type: choice
        options:
          - setup
          - build
          - test
          - npm-package
          - docs
          - publish-npm
          - publish-container
          - report

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/rbe/dashboard
  VERSION: "1.0.0"
  NODE_VERSION: "24"

jobs:
  setup:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.job == 'setup' ||
      inputs.job == 'npm-package' ||
      inputs.job == 'publish-npm' ||
      inputs.job == 'publish-container' ||
      inputs.job == 'report'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install, audit, and check the version
        run: make setup
      - uses: actions/upload-artifact@v7
        with:
          name: node_modules
          path: ci-artifacts/node_modules.tar
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-setup
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  build:
    needs: setup
    if: >-
      always() &&
      (
        (github.event_name != 'workflow_dispatch' && needs.setup.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'build') ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.job == 'npm-package' || inputs.job == 'publish-npm' || inputs.job == 'publish-container' || inputs.job == 'report') &&
          needs.setup.result == 'success'
        )
      )
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: node_modules
          path: ci-artifacts
      - name: Build the Linux binary and the container image
        run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: container-image
          path: ${{ github.event.repository.name }}-image.tar
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-build
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  test:
    needs: setup
    if: >-
      always() &&
      (
        (github.event_name != 'workflow_dispatch' && needs.setup.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'test') ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.job == 'npm-package' || inputs.job == 'publish-npm' || inputs.job == 'publish-container' || inputs.job == 'report') &&
          needs.setup.result == 'success'
        )
      )
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: node_modules
          path: ci-artifacts
      - name: Test
        run: make test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-test
          path: |
            build/logs
            build/summaries
            build/test-results.json
            build/coverage
          if-no-files-found: ignore
          retention-days: 1

  npm-package:
    needs: [build, test]
    if: >-
      always() &&
      (
        (
          github.event_name != 'workflow_dispatch' &&
          needs.build.result == 'success' &&
          needs.test.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.job == 'npm-package' || inputs.job == 'publish-npm' || inputs.job == 'report') &&
          needs.build.result == 'success' &&
          needs.test.result == 'success'
        )
      )
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: node_modules
          path: ci-artifacts
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Pack the npm tarball
        run: make npm-package
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: build/*.tgz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-npm-package
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  docs:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'docs' || inputs.job == 'report'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Render docs to HTML
        run: make docs
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: build/docs
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-docs
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  publish-npm:
    needs: [npm-package, test]
    if: >-
      always() &&
      needs.npm-package.result == 'success' &&
      needs.test.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.job == 'publish-npm') ||
        (
          github.event_name == 'push' &&
          vars.NPM_PUBLISH == 'true' &&
          (
            github.ref == 'refs/heads/master' ||
            github.ref == 'refs/heads/main' ||
            startsWith(github.ref, 'refs/tags/v')
          )
        )
      )
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: build
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Publish the npm package
        run: make publish-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && 'true' || vars.NPM_PUBLISH }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-publish-npm
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  publish-container:
    needs: [build, test]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.job == 'publish-container') ||
        (
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/master' ||
            github.ref == 'refs/heads/main' ||
            startsWith(github.ref, 'refs/tags/v')
          )
        )
      )
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: container-image
          path: image
      - name: Log in to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GHCR_TOKEN" | podman login "${IMAGE_NAME%%/*}" --username "$REGISTRY_USER" --password-stdin
      - name: Push the image
        run: make publish-container
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-publish-container
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  report:
    needs: [setup, build, test, npm-package, docs, publish-npm, publish-container]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: report-*
          path: build/inputs
      - name: Collect the run into one report
        run: make report
        env:
          DISPATCH_JOB: ${{ inputs.job }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
          JOB_RESULT_SETUP: ${{ needs.setup.result }}
          JOB_RESULT_BUILD: ${{ needs.build.result }}
          JOB_RESULT_TEST: ${{ needs.test.result }}
          JOB_RESULT_NPM_PACKAGE: ${{ needs.npm-package.result }}
          JOB_RESULT_DOCS: ${{ needs.docs.result }}
          JOB_RESULT_PUBLISH_NPM: ${{ needs.publish-npm.result }}
          JOB_RESULT_PUBLISH_IMAGE: ${{ needs.publish-container.result }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report
          path: build/report
          if-no-files-found: error
          retention-days: 14
