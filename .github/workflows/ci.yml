# One pipeline. Delivery is the container image.
# Jobs: setup, then build, test, and docs beside each other, then
# publish-container (needs build and test), then report.
# publish-container runs on a push to the default branch (master) and when
# workflow_dispatch selects it. A tag push does not start a run; after
# tagging vX.Y.Z, dispatch publish-container. Any other branch skips it.
# A default-branch publish tags <X.Y.Z>-<run> and latest, then keeps that
# run and the next-lower run on the same line. A manual publish from any
# other ref tags the version only: it does not move latest and cleanup
# deletes nothing. A missing GHCR package is an empty list. Cleanup leaves
# a version that still has latest or any tag other than X.Y.Z-<run>.
# A skipped or failed publish deletes nothing.
# report is last and still runs when an earlier job fails or is skipped.
# Every step is checkout, artifact transfer, or make. Registry login is make login.

name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      job:
        description: Job to run (with the jobs it needs, then report)
        required: true
        type: choice
        options: [setup, build, test, docs, publish-container, report]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/rbe/dashboard
  NODE_VERSION: "24"
  SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  setup:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Free artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: make cleanup-actions-artifacts
      - run: make setup
      - uses: actions/upload-artifact@v7
        with:
          name: deps
          path: build/deps/node_modules.tar
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-setup
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  build:
    needs: setup
    if: success() && (github.event_name == 'push' || contains(fromJSON('["build","publish-container","report"]'), inputs.job))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deps
          path: build/deps
      - run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: build/image
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-build
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  test:
    needs: setup
    if: success() && (github.event_name == 'push' || contains(fromJSON('["test","publish-container","report"]'), inputs.job))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deps
          path: build/deps
      - run: make test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-test
          path: |
            build/logs
            build/summaries
            build/test-results
            build/coverage
          if-no-files-found: ignore
          retention-days: 1

  docs:
    needs: setup
    if: success() && (github.event_name == 'push' || contains(fromJSON('["docs","report"]'), inputs.job))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make docs
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: build/docs
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-docs
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  publish-container:
    needs: [build, test]
    if: >-
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'publish-container')
      )
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: build/image
      - name: Log in to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: make login
      - run: make publish-container
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - run: make cleanup-container-versions
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-publish-container
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  report:
    needs: [setup, build, test, docs, publish-container]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: report-*
          path: build/inputs
      - run: make report
        env:
          DISPATCH_JOB: ${{ inputs.job }}
          JOB_RESULT_SETUP: ${{ needs.setup.result }}
          JOB_RESULT_BUILD: ${{ needs.build.result }}
          JOB_RESULT_TEST: ${{ needs.test.result }}
          JOB_RESULT_DOCS: ${{ needs.docs.result }}
          JOB_RESULT_PUBLISH_CONTAINER: ${{ needs.publish-container.result }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report
          path: build/report
          if-no-files-found: error
          retention-days: 14
