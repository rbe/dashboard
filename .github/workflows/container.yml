# Image entry point for pull requests, master, tags, and manual runs.
# Host tests stay on CI (pull requests and master) or Release (tags).

name: Container

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    # Passed through to container-image.yml. Only the publish job keeps packages: write.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-image.yml
    secrets: inherit
