# Image entry point for every branch push, v* tags, and manual runs.
# Host tests stay on CI for branches and on Release for tags.
# No pull_request trigger, so a same-repo branch push builds the image once.

name: Container

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  image:
    # Passed through to container-image.yml. Only the publish job keeps packages: write.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-image.yml
    secrets: inherit
