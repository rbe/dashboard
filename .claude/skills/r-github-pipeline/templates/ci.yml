# One pipeline for any language. Delivery is the container image.
# Jobs: setup, then build and test beside each other, then
# publish-container (needs build and test), then report.
# Blocks between "keep" and "end" comment lines are optional: keep a
# block or delete it with both of its comment lines. With every optional
# block deleted, this file is the plain image pipeline. Node keeps the
# Node blocks. A Gradle project that publishes a GitHub release with the
# JAR keeps the Release blocks, and the JAR blocks if the image is built
# from the tested JAR. With the JAR blocks deleted, build hands the image
# tar to publish-container.
# There is no docs job. A repository that renders docs adds a docs job
# that runs `make docs`, the docs target, and its own renderer.
# publish-container runs when workflow_dispatch selects it: a human
# starts it, so a large image stays inside the GitHub quotas. It runs on
# a push to the default branch only when the repository variable
# AUTO_PUBLISH is true. A tag push does not start a run; after tagging
# vX.Y.Z, dispatch publish-container. Any other branch skips it.
# A default-branch publish tags <X.Y.Z>-<run> and latest, then keeps that
# run and the next-lower run on the same line. A manual publish from any
# other ref tags the version only: it does not move latest and cleanup
# deletes nothing. A skipped or failed publish deletes nothing.
# report is last and still runs when an earlier job fails or is skipped.
# setup runs make ci-scope after the artifact cleanup. If a push changes
# only board files and the CI run of its base commit passed, setup skips
# make setup, and build and test skip. A skipped job counts as passed
# for make ci-status and make pull-request-merge.
# The Make contract is the r-project-setup skill: help is the default goal.
# setup, build, test, and login are that skill's target names. This
# workflow calls make; it does not define the contract. Every step is
# checkout, an artifact upload or download, or make. The language runs
# inside the targets, in Podman. Replace OWNER and NAME.
# The name publish-github stays in the contains() lists of build and
# test. Without the Release blocks no job has that name, so the name
# never matches.

name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      job:
        description: Job to run (with the jobs it needs, then report)
        required: true
        type: choice
        options:
          - setup
          - build
          - test
          - publish-container
          # Release: keep when the project publishes a GitHub release.
          - publish-github
          # End of Release.
          - report

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/OWNER/NAME
  SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  # Node: keep for a Node project.
  NODE_VERSION: "24"
  # End of Node.

jobs:
  setup:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    outputs:
      board-only: ${{ steps.scope.outputs.board-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Free artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: make cleanup-actions-artifacts
      - name: Skip setup, build, and test for a push of board files only
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BEFORE: ${{ github.event.before }}
        run: make ci-scope
      - if: steps.scope.outputs.board-only != 'true'
        run: make setup
      # Node: keep for a Node project. make setup packs the dependencies.
      - uses: actions/upload-artifact@v7
        if: steps.scope.outputs.board-only != 'true'
        with:
          name: deps
          path: build/deps/node_modules.tar
          if-no-files-found: error
          retention-days: 1
      # End of Node.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-setup
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  build:
    needs: setup
    if: (github.event_name == 'push' && needs.setup.outputs.board-only != 'true') || contains(fromJSON('["build","publish-container","publish-github","report"]'), inputs.job)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Node: keep for a Node project.
      - uses: actions/download-artifact@v8
        with:
          name: deps
          path: build/deps
      # End of Node.
      - run: make build
      # Image: keep when publish-container pushes the image tar of make build.
      # Delete it when the JAR blocks stay.
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: build/image
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      # End of Image.
      # JAR: keep when publish builds the image from the tested JAR.
      # Delete it when the Image block stays.
      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/dist
          if-no-files-found: error
          retention-days: 1
      # End of JAR.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-build
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  test:
    needs: setup
    if: (github.event_name == 'push' && needs.setup.outputs.board-only != 'true') || contains(fromJSON('["test","publish-container","publish-github","report"]'), inputs.job)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Node: keep for a Node project.
      - uses: actions/download-artifact@v8
        with:
          name: deps
          path: build/deps
      # End of Node.
      - run: make editorconfig
      - run: make format
      - run: make lint
      - run: make test
      - run: make integration
      - run: make coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-test
          path: |
            build/logs
            build/summaries
            build/test-results
            build/coverage
            build/reports
          if-no-files-found: ignore
          retention-days: 1

  publish-container:
    needs: [build, test]
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.AUTO_PUBLISH == 'true') ||
      inputs.job == 'publish-container'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # Image: keep with the Image block of the build job.
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: build/image
      # End of Image.
      # JAR: keep with the JAR block of the build job.
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: build/dist
      # End of JAR.
      - run: make login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
      - run: make publish-container
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - run: make cleanup-container-versions
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-publish-container
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  # Release: keep when the project publishes a GitHub release. It needs
  # the JAR block of the build job, or another file in build/dist.
  publish-github:
    needs: [build, test]
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.AUTO_PUBLISH == 'true') ||
      inputs.job == 'publish-github'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: build/dist
      - run: make publish-github
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - run: make cleanup-github-releases
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-publish-github
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1
  # End of Release.

  report:
    needs:
      - setup
      - build
      - test
      - publish-container
      # Release: keep when the project publishes a GitHub release.
      - publish-github
      # End of Release.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: report-*
          path: build/inputs
      - run: make report
        env:
          DISPATCH_JOB: ${{ inputs.job }}
          JOB_RESULT_SETUP: ${{ needs.setup.result }}
          JOB_RESULT_BUILD: ${{ needs.build.result }}
          JOB_RESULT_TEST: ${{ needs.test.result }}
          JOB_RESULT_PUBLISH_CONTAINER: ${{ needs.publish-container.result }}
          # Release: keep when the project publishes a GitHub release.
          JOB_RESULT_PUBLISH_GITHUB: ${{ needs.publish-github.result }}
          # End of Release.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report
          path: build/report
          if-no-files-found: error
          retention-days: 14
